name: Validate learning database
on:
  pull_request:
    paths:
      - 'data.js'
      - 'game.js'
      - 'subject-navigation.js'
      - 'scripts/**'
      - '.github/workflows/validate-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check subject-navigation.js
          node --check data.js
      - name: Validate catalog and questions
        run: node scripts/validate-learning.js
